<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Change a point color</title>
  </head>

  <body onload="main()">
    <canvas id="webgl" width="640" height="480">
    Please use a browser that supports "canvas"
    </canvas>

    <div id="debug"></div>

    <script src="../lib/webgl-utils.js"></script>
    <script src="../lib/webgl-debug.js"></script>
    <script src="../lib/cuon-utils.js"></script>
    <script src="../lib/cuon-matrix-cse160.js"></script>
    <script src="../lib/Triangle.js"></script>
    <script src="../lib/Cube.js"></script> 
    <script src="../lib/Pyramid.js"></script> 
    <script src="../lib/BlockyAnimal.js"></script>
    <script src="../lib/Circle.js"></script>

    <p>
    Global Rotation Y <input type="range" min="0" max="360" value="0" class="slider" id="angleSlideY">
    </p>

    <p>
    Global Rotation X <input type="range" min="0" max="360" value="0" class="slider" id="angleSlideX">
    </p>

    <p>
    Walking Animation <button id="animWalk">On</button> <button id="animWalkOff">Off</button>
    </p>
    <p>
    Breathing Animation <button id="animBreathe">On</button> <button id="animBreatheOff">Off</button>
    </p>
    <p>
    Tail Animation <button id="animSway">On</button> <button id="animSwayOff">Off</button>
    </p>

    <p>
    zoom<input type="range" min="50" max="100" value="0.25" class="slider" id="zoom">
    </p>

    <p>
    Thigh Angle <input type="range" min="0" max="360" value="0" class="slider" id="thighSlide">
    </p>

    <p>
    Shin Angle <input type="range" min="0" max="360" value="0" class="slider" id="shinSlide">
    </p>

    <p>
    Neck Angle <input type="range" min="0" max="360" value="0" class="slider" id="neckSlide">
    </p>

  </body>
</html>
